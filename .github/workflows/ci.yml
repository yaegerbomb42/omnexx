name: ci

# Two lanes:
#   fast  — experimental/** pushes: typecheck + only the tests related to changed files (<2 min).
#   pr    — PRs into main: format, lint, typecheck, affected tests, build + pack smoke. This is the
#           check PRs wait on; it never waits for the full suite.
#   full  — push to main (and nightly, see nightly.yml): the whole suite sharded in parallel
#           across every OS / Node version, plus the packaging smoke on each platform.
on:
  pull_request:
  push:
    branches: [main, 'experimental/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # No workflow uses a real key or calls a paid API. Tests isolate state in temp dirs.
  OMNEXX_CHAOS_ITERATIONS: '20'

jobs:
  fast:
    name: fast (typecheck + related unit tests)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/experimental/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get install -y -qq ripgrep
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - name: Unit tests related to files changed vs main (integration runs on the PR)
        run: npm run test:fast

  pr:
    name: pr (lint + affected tests + build)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Affected tests (unit + integration + chaos touching changed files)
        # vitest's --changed reruns everything when config/package files change.
        run: npm run test:affected
      - run: npm run build
      - run: npm pack
      - name: Install the tarball and smoke it
        shell: bash
        run: |
          prefix="$(mktemp -d)"
          npm i -g --prefix "$prefix" ./omnexx-*.tgz
          export PATH="$prefix/bin:$PATH" OMNEXX_HOME="$(mktemp -d)" OMNEXX_CONFIG_HOME="$(mktemp -d)"
          omnexx --help
          omnexx --version
          # Placeholder so the key check passes offline; it is never sent anywhere.
          OMNEXX_ANTHROPIC_API_KEY="sk-ant-ci-placeholder-not-a-key" omnexx doctor --offline

  full:
    name: full ${{ matrix.os }} / node ${{ matrix.node }} / shard ${{ matrix.shard }}
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/experimental/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install ripgrep (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Install ripgrep (macos)
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:shard -- --shard=${{ matrix.shard }}/4

  static:
    name: full static + package ${{ matrix.os }} / node ${{ matrix.node }}
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/experimental/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm pack
      - name: Install the tarball globally into a temp prefix and smoke it
        shell: bash
        run: |
          prefix="$(mktemp -d)"
          npm i -g --prefix "$prefix" ./omnexx-*.tgz
          export PATH="$prefix/bin:$PATH" OMNEXX_HOME="$(mktemp -d)" OMNEXX_CONFIG_HOME="$(mktemp -d)"
          omnexx --help
          omnexx --version
          OMNEXX_ANTHROPIC_API_KEY="sk-ant-ci-placeholder-not-a-key" omnexx doctor --offline
      - name: Validate the generated systemd unit (ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export OMNEXX_HOME="$(mktemp -d)" OMNEXX_CONFIG_HOME="$(mktemp -d)"
          dir="$(mktemp -d)"
          node dist/cli.js service install --dry-run > "$dir/omnexx.service"
          systemd-analyze verify "$dir/omnexx.service"
      - name: Validate the generated launchd plist (macos)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export OMNEXX_HOME="$(mktemp -d)" OMNEXX_CONFIG_HOME="$(mktemp -d)"
          dir="$(mktemp -d)"
          node dist/cli.js service install --dry-run > "$dir/org.omnexx.supervisor.plist"
          plutil -lint "$dir/org.omnexx.supervisor.plist"

  coverage:
    name: full coverage (ubuntu / node 24)
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/experimental/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
