name: release

# Publishes to npm only when a maintainer pushes a version tag (git tag v0.3.0 && git push --tags).
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret; configure the trusted publisher for
# this repo and workflow on npmjs.com first. --provenance links the package to this build.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Tag matches package.json
        run: |
          want="v$(node -p 'require("./package.json").version')"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME != $want"; exit 1; }
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public

  # Publishes the VS Code extension (with the CLI built in) to the VS Code Marketplace and Open
  # VSX. --skip-duplicate makes it a no-op when vscode/package.json wasn't bumped for this tag.
  extension:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Package
        working-directory: vscode
        run: npm run package
      - name: VS Code Marketplace
        working-directory: vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath omnexx-*.vsix --skip-duplicate
      - name: Open VSX
        working-directory: vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish omnexx-*.vsix --skip-duplicate
