# Bench task fixtures are not product code: starting repos are buggy or legacy on purpose, hidden
# checks hold frozen copies of that legacy code as oracles, and reference solutions mirror the
# starting repos. Analysing them only adds noise and duplication.
sonar.exclusions=bench/suites/*/*/repo/**,bench/suites/*/*/hidden/**,bench/suites/*/*/solution/**
sonar.cpd.exclusions=bench/suites/*/*/repo/**,bench/suites/*/*/hidden/**,bench/suites/*/*/solution/**
